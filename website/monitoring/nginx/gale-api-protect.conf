# Shared per-client rate zone for the tailnet write surfaces (/api/fleet,
# /api/agora, /api/ollama, /api/push, /api/firewalla). Backends enforce
# their own caps too; this is the first line against tailnet-level abuse.
# limit_req_zone must live in the http context (conf.d/* is included there).
#
# GET/HEAD are exempt (empty key = not accounted): the dashboards poll
# /api/fleet/* and stream SSE every few seconds from several pages at once,
# and a 10r/m zone 503'd them into looking "down" (nginx log 2026-10-07
# 00:11Z, client 192.168.1.55: metrics/alerts/stream all limited). Writes
# (POST/PUT/PATCH/DELETE) stay limited at 10r/m per client IP, burst 20.
map $request_method $gale_api_key {
    GET     "";
    HEAD    "";
    default $binary_remote_addr;
}
limit_req_zone $gale_api_key zone=gale_api:10m rate=10r/m;