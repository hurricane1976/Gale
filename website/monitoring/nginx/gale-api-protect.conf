# Shared per-client rate zone for the tailnet write surfaces (/api/fleet,
# /api/agora, /api/ollama, /api/push, /api/firewalla). Backends enforce
# their own caps too; this is the first line against tailnet-level abuse.
# limit_req_zone must live in the http context (conf.d/* is included there).
limit_req_zone $binary_remote_addr zone=gale_api:10m rate=10r/m;
