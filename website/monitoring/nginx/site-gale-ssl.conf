# TLS mirror of the gale site (ROADMAP item 11). Serves the same root and
# API locations over https://gale-agent.tail2f1671.ts.net -- required for a
# secure context so the PWA service worker (item 1) can actually register.
# Cert via `tailscale cert`, auto-renewed by tailscaled; deploy.sh reloads
# nginx, but renewals only swap these files, so add a weekly systemd timer
# reload if the leaf cert ever lapses (tailscale renews at ~90d with 30d+
# headroom and reloads nginx itself on 1.x via hook when enabled).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 8443 ssl;
    listen [::]:8443 ssl;

    server_name gale-agent.tail2f1671.ts.net;

    ssl_certificate /etc/nginx/ssl/gale-agent.tail2f1671.ts.net.crt;
    ssl_certificate_key /etc/nginx/ssl/gale-agent.tail2f1671.ts.net.key;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    include /etc/nginx/snippets/gale-sec.conf;
    include /etc/nginx/snippets/gale-hsts.conf;
    root /var/www/gale;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        error_page 404 /404.html;
        # HTML/CSS/JS are unhashed: revalidate every load, never serve stale
        # across deploys (sw.js especially must stay fresh).
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/snippets/gale-sec.conf;
        include /etc/nginx/snippets/gale-hsts.conf;
        add_header Cache-Control "no-cache";
    }

    # Content-hashed build output (esbuild chunk-[hash].js): immutable for a
    # year. A new deploy mints new hashes, so stale-forever is safe here and
    # repeat loads skip revalidation entirely.
    location ~ "^/(gale|fleet-tidal|cinematic|storm-scene|mobile|fonts)\.[0-9a-f]{8}\.css$" {
        # content-hashed by tools/rewrite-dist-refs.mjs at deploy time
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/snippets/gale-sec.conf;
        include /etc/nginx/snippets/gale-hsts.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/fonts/ {
        # self-hosted woff2 (fonts.css); filenames only change with the font
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /dist/ {
        alias /var/www/gale/dist/;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/snippets/gale-sec.conf;
        include /etc/nginx/snippets/gale-hsts.conf;
        # Entry bundles are content-hashed since build.mjs entryNames [name]-[hash]
        # (the rewrite step points HTML/sw.js at them), so immutable is safe. Formerly stable names that changed under
        # the SAME URL on every deploy, so they must revalidate instead of being
        # cached immutable (immutable entries that import a now-deleted
        # chunk-<hash>.js go hard-dark, and a hard refresh keeps the stale copy).
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /dist/chunks/ {
        alias /var/www/gale/dist/chunks/;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/snippets/gale-sec.conf;
        include /etc/nginx/snippets/gale-hsts.conf;
        # chunk-<hash>.js / *.map: content-hashed; a redeploy mints a new hash
        # and removes the old file, so immutable-for-a-year is safe here.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/api/(\.|control-audit) { return 404; }

    location /api/ {
        alias /var/www/gale-api/;
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    location /api/fleet/ {
        proxy_pass http://127.0.0.1:8793/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    location /api/agora/ {
        proxy_pass http://127.0.0.1:8793/agora/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
    }

    location /api/ollama/ {
        proxy_pass http://127.0.0.1:8794/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        add_header Cache-Control "no-store";
    }

    location /api/push/ {
        proxy_pass http://127.0.0.1:8795/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
    }

    location /api/firewalla/ {
        proxy_pass http://127.0.0.1:8791/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store";
    }
}
