# Extra security headers for the Gale site (included in every location that sets
# add_header, since nginx doesn't inherit add_header into locations that define their own).
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# weather.html legitimately uses leaflet (unpkg), RainViewer, Open-Meteo, ArcGIS tiles, api.weather.gov
# Report-Only first: observe in the browser console, tighten to enforcing later.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self'; img-src 'self' data: blob: https://unpkg.com https://server.arcgisonline.com https://tilecache.rainviewer.com; connect-src 'self' https://api.rainviewer.com https://api.open-meteo.com https://air-quality-api.open-meteo.com https://api.weather.gov; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
