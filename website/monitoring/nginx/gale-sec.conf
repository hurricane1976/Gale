# Extra security headers for the Gale site (included in every location that sets
# add_header, since nginx doesn't inherit add_header into locations that define their own).
# h3 advertisement: lives here (not server-level) because every location defines its
# own add_header set and nginx doesn't inherit server-level headers into those.
add_header Alt-Svc 'h3=":443"; ma=86400' always;
# Speculation rules via Link header (review 2026-10-11): the rules used to be
# inline <script type="speculationrules"> blocks on every page, but Chromium
# applies script-src to those blocks -- under the enforcing CSP each page would
# need its rules' content hash. The header form needs no CSP carve-out, keeps
# one fleet-wide rules file (specrules.json), and unsupported browsers ignore it.
add_header Link '<specrules.json>; rel="speculationrules"' always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# COEP credentialless + CORP (review 2026-10-11): with COOP this makes the
# origin cross-origin-isolated, enabling performance.measureUserAgentSpecificMemory()
# in the Reliability console (real JS memory, not guesses). credentialless loads
# cross-origin no-cors subresources (weather map tiles) without credentials and
# without requiring CORP on third parties; Chromium, Firefox 132+, and Safari
# 18.2+ support it, older browsers treat it as unsafe-none (graceful).
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Browser report collector: CSP violations (report-to), deprecation and
# intervention reports (default group), received by fleet_api POST /report.
add_header Reporting-Endpoints 'csp-endpoint="/api/fleet/report", default="/api/fleet/report"' always;
#
# Enforcing CSP. script-src allows only same-origin scripts plus the four
# static inline bootstraps by content hash (pre-paint theme + html.js flag;
# identical across pages, so the list is stable between deploys -- an edit
# shows up as a loud console violation and a /api/fleet/report delivery).
# style-src keeps 'unsafe-inline': the pages set style attributes and inject
# CSSOM styles liberally; hashing those is not practical. Leaflet is
# self-hosted under /assets/vendor/, so no third-party script origin remains.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-N7JTLCiolJ1vfDdIqpotBSegMQODGbZewFbzt9X8Z8U=' 'sha256-WZRJfWvsnNCPcxzZwvyhovnZGqhZaC+8gPGPRbx6wTk=' 'sha256-zgQBTD51pC2kcX0MDjrX6yppqRbejOwiPc9vgls0fzw=' 'sha256-cmDnU7kD1vyD/4PqqhnLTT77t2m2pccHQwrG/zL9O+o='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://server.arcgisonline.com https://tilecache.rainviewer.com https://mapservices.weather.noaa.gov; connect-src 'self' https://api.rainviewer.com https://api.open-meteo.com https://air-quality-api.open-meteo.com https://api.weather.gov https://mapservices.weather.noaa.gov https://geocoding-api.open-meteo.com https://api.bigdatacloud.net; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-to csp-endpoint" always;
# Report-Only twin kept in parallel for one observation week: any directive the
# enforcing policy would break shows up here first (disposition "report").
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-N7JTLCiolJ1vfDdIqpotBSegMQODGbZewFbzt9X8Z8U=' 'sha256-WZRJfWvsnNCPcxzZwvyhovnZGqhZaC+8gPGPRbx6wTk=' 'sha256-zgQBTD51pC2kcX0MDjrX6yppqRbejOwiPc9vgls0fzw=' 'sha256-cmDnU7kD1vyD/4PqqhnLTT77t2m2pccHQwrG/zL9O+o='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://server.arcgisonline.com https://tilecache.rainviewer.com https://mapservices.weather.noaa.gov; connect-src 'self' https://api.rainviewer.com https://api.open-meteo.com https://air-quality-api.open-meteo.com https://api.weather.gov https://mapservices.weather.noaa.gov https://geocoding-api.open-meteo.com https://api.bigdatacloud.net; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-to csp-endpoint" always;
