# Compression for the Gale site (and everything else on this nginx).
# Default gzip level is 1 and Vary was off; brotli added via libnginx-mod-http-brotli.
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_proxied any;
brotli on;
brotli_comp_level 5;
brotli_min_length 512;
brotli_static on;
brotli_types text/plain text/css application/json application/javascript text/javascript application/manifest+json image/svg+xml text/xml application/xml;
