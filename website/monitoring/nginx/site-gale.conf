server {
    listen 8090;
    listen [::]:8090;

    server_name _;

    # never leak the tailnet URL to third parties (weather APIs, tile CDNs)
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    include /etc/nginx/snippets/gale-sec.conf;
    root /var/www/gale;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        error_page 404 /404.html;
        # HTML/CSS/JS are unhashed: revalidate every load, never serve stale
        # across deploys (sw.js especially must stay fresh).
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/snippets/gale-sec.conf;
        add_header Cache-Control "no-cache";
    }

    # Content-hashed build output (esbuild chunk-[hash].js): immutable for a
    # year. A new deploy mints new hashes, so stale-forever is safe here and
    # repeat loads skip revalidation entirely.
    location ~ "^/(gale|fleet-tidal|cinematic|storm-scene|mobile|fonts)\.[0-9a-f]{8}\.css$" {
        # content-hashed by tools/rewrite-dist-refs.mjs at deploy time
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/snippets/gale-sec.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/fonts/ {
        # self-hosted woff2 (fonts.css); filenames only change with the font
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /dist/ {
        alias /var/www/gale/dist/;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/snippets/gale-sec.conf;
        # Entry bundles are content-hashed since build.mjs entryNames [name]-[hash]
        # (the rewrite step points HTML/sw.js at them), so immutable is safe. Formerly stable names that changed under
        # the SAME URL on every deploy, so they must revalidate instead of being
        # cached immutable (immutable entries that import a now-deleted
        # chunk-<hash>.js go hard-dark, and a hard refresh keeps the stale copy).
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /dist/chunks/ {
        alias /var/www/gale/dist/chunks/;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/snippets/gale-sec.conf;
        # chunk-<hash>.js / *.map: content-hashed; a redeploy mints a new hash
        # and removes the old file, so immutable-for-a-year is safe here.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Ops dashboard data feed. Separate root, separate ownership (agent:agent,
    # written by gale-sysmon.service) from /var/www/gale on purpose -- so
    # website/deploy.sh's `chown -R www-data:www-data /var/www/gale` never
    # touches it and can't race the collector's writes.
    location /api/ {
        alias /var/www/gale-api/;
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    # Firewalla control service (pause/resume rules, block/unblock a
    # device). Proxied rather than aliased since this needs a live backend,
    # not a static file -- firewalla_control.py binds 127.0.0.1:8791 only,
    # this location is what makes it tailnet-reachable. No auth added here
    # beyond the site's existing no-login model, by explicit operator choice.

    # Fleet data service (fleet_api.py, 127.0.0.1:8793): telemetry,
    # activity, metrics, observability, agora board. Proxied rather than
    # aliased since these need a live backend, not a static file. The agora
    # POST is the site's first unauthenticated write surface (tailnet-only,
    # like everything here) -- backend does length caps, rate limits, and
    # duplicate suppression; X-Real-IP is what it rate-limits on.
    location /api/fleet/ {
        proxy_pass http://127.0.0.1:8793/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    location /api/agora/ {
        proxy_pass http://127.0.0.1:8793/agora/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
    }

    # Ollama admin service (ollama_api.py, 127.0.0.1:8794): live snapshot,
    # sampled history, model show, admin actions (unload/pull/delete) and a
    # chat playground proxy for the LAN inference server. Proxied rather
    # than aliased -- live backend. This is a write surface to shared
    # infrastructure: backend enforces action allowlist, model-name
    # validation, per-IP rate limits and body caps; X-Real-IP is what it
    # rate-limits on. Long read timeout for non-streamed chat replies.
    location /api/ollama/ {
        proxy_pass http://127.0.0.1:8794/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        add_header Cache-Control "no-store";
    }

    location /api/push/ {
        proxy_pass http://127.0.0.1:8795/;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
    }

    location /api/firewalla/ {
        proxy_pass http://127.0.0.1:8791/;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store";
    }
}
