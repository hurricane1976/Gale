server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /var/lib/promtail/positions.yaml
clients:
- url: http://127.0.0.1:3100/loki/api/v1/push
scrape_configs:
- job_name: journal
  journal:
    max_age: 12h
    path: /var/log/journal
    labels:
      job: systemd-journal
      host: gale-agent
  relabel_configs:
  - source_labels:
    - __journal__systemd_unit
    target_label: unit
  - source_labels:
    - __journal_priority_keyword
    target_label: level
- job_name: fleet-lifecycle
  static_configs:
  - targets:
    - localhost
    labels:
      job: fleet-lifecycle
      host: gale-agent
      __path__: /var/www/gale-api/task-events.jsonl
- job_name: fleet-controls
  static_configs:
  - targets:
    - localhost
    labels:
      job: fleet-controls
      host: gale-agent
      __path__: /var/www/gale-api/control-audit.jsonl
