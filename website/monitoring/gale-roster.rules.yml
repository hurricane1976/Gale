groups:
- name: gale-roster
  interval: 60s
  rules:
  - alert: GaleAgentSilent
    expr: gale_roster_silent == 1
    for: 6h
    labels:
      severity: warning
      owner: gale
    annotations:
      summary: '{{ $labels.agent }} ({{ $labels.fleet_host }}) is on the roster but reports no runs'
      description: no runs in fleet telemetry (14d window) -- the host's relay may not be forwarding it, or the agent never
        woke
      runbook_url: https://gale-agent.tail2f1671.ts.net/runbooks.html
  - alert: GaleRosterDrift
    expr: gale_roster_drift == 1
    for: 30m
    labels:
      severity: warning
      owner: gale
    annotations:
      summary: 'roster drift: {{ $labels.kind }} for {{ $labels.agent }}'
      description: page / roster.json / opencode.json / AGENT.md disagree -- run tools/roster_check.py --report
      runbook_url: https://gale-agent.tail2f1671.ts.net/runbooks.html
  - alert: GaleRosterCheckStale
    expr: (time() - gale_roster_check_unixtime > 1200) or absent(gale_roster_check_unixtime)
    for: 5m
    labels:
      severity: warning
      owner: gale
      host: gale-agent
    annotations:
      summary: roster_check stopped updating (20m+)
      description: gale_roster.prom stale -- cron entry dead or the script is erroring
      runbook_url: https://gale-agent.tail2f1671.ts.net/runbooks.html
