templates:
- /etc/alertmanager/templates/*.tmpl
route:
  receiver: default
  group_by:
  - alertname
  - host
  - fleet_host
  - agent
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - matchers:
    - severity="critical"
    receiver: critical
    repeat_interval: 1h
inhibit_rules:
- source_matchers:
  - alertname="GaleInfraDown"
  target_matchers:
  - alertname=~"GaleSynthFailing|GaleSynthStale|GalePeerDown|GaleWakeMissed"
  equal:
  - host
  - fleet_host
- source_matchers:
  - alertname="GaleWakeBridgeStale"
  target_matchers:
  - alertname=~"GaleWakeMissed|GaleWakeErrors|GaleWakeSessionStuck"
  equal:
  - host
  - fleet_host
- source_matchers:
  - alertname="GaleRosterCheckStale"
  target_matchers:
  - alertname=~"GaleAgentSilent|GaleRosterDrift"
  equal:
  - host
  - fleet_host
- source_matchers:
  - severity="critical"
  target_matchers:
  - severity="warning"
  equal:
  - alertname
  - host
  - fleet_host
  - agent
  - component
receivers:
- name: default
  webhook_configs:
  - url: http://127.0.0.1:9094/
    send_resolved: true
- name: critical
  webhook_configs:
  - url: http://127.0.0.1:9094/
    send_resolved: true
  telegram_configs:
  - bot_token_file: /etc/alertmanager/telegram_bot_token
    chat_id: 8986669804
    api_url: https://api.telegram.org
    parse_mode: HTML
    send_resolved: true
    message: '{{ template "gale.telegram.message" . }}'
