templates:
- /etc/alertmanager/templates/*.tmpl
# Maintenance windows (review 2026-10-11): planned work silences the routine
# route; the critical route deliberately stays outside the mute so a real
# outage during maintenance still pages. Windows live here so the UI's
# acknowledgement system and this file can't drift apart silently.
time_intervals:
- name: gale-maintenance
  time_intervals:
  # Sunday early-UTC window, aligned with the lowest-traffic slot in the
  # fleet's wake schedule (00:00-06:00Z cycle runs before it).
  - times:
    - start_time: '03:00'
      end_time: '05:00'
    weekdays: ['sunday']
# ADD: Post-deploy quiet window
- name: gale-post-deploy
  time_intervals:
  - times:
    - start_time: '00:00'
      end_time: '00:30'
    days_of_week: ['monday', 'tuesday', 'wednesday', 'thursday', 'friday']
route:
  receiver: default
  group_by:
  - alertname
  - host
  - fleet_host
  - agent
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - matchers:
    - severity="critical"
    receiver: critical
    repeat_interval: 1h
  # Dead-man's switch: kept off the pager; pings an external heartbeat
  # (URL in /etc/alertmanager/watchdog_url, root:alertmanager 0640, not in repo).
  # MUST route before the muted catch-all: the heartbeat may never be muted,
  # or the dead-man's switch would itself go dark during maintenance.
  - matchers:
    - alertname="Watchdog"
    receiver: watchdog
    group_wait: 0s
    group_interval: 1m
    repeat_interval: 5m
  # Routine (warning/info) alerts pass through the maintenance-mute wrapper.
  # The root default stays unmuted for anything that matches neither route.
  - matchers:
    - severity=~"warning|info"
    receiver: default
    mute_time_intervals:
    - gale-maintenance
inhibit_rules:
- source_matchers:
  - alertname="GaleInfraDown"
  target_matchers:
  - alertname=~"GaleSynthFailing|GaleSynthStale|GalePeerDown|GaleWakeMissed"
  equal:
  - host
  - fleet_host
- source_matchers:
  - alertname="GaleWakeBridgeStale"
  target_matchers:
  - alertname=~"GaleWakeMissed|GaleWakeErrors|GaleWakeSessionStuck"
  equal:
  - host
  - fleet_host
- source_matchers:
  - alertname="GaleRosterCheckStale"
  target_matchers:
  - alertname=~"GaleAgentSilent|GaleRosterDrift"
  equal:
  - host
  - fleet_host
- source_matchers:
  - severity="critical"
  target_matchers:
  - severity="warning"
  equal:
  - alertname
  - host
  - fleet_host
  - agent
  - component
# Suppress API latency alerts when API itself is down
- source_matchers:
  - alertname="GaleFleetApiDown"
  target_matchers:
  - alertname=~"GaleApiLatencyHigh|GaleApiLatencyP95"
  equal:
  - component
# Suppress GPU alerts when host is down
- source_matchers:
  - alertname=~"GaleHostDown|GaleCollectorStale"
  target_matchers:
  - alertname=~"GaleGpu.*"
  equal:
  - fleet_host
receivers:
- name: watchdog
  webhook_configs:
  - url_file: /etc/alertmanager/watchdog_url
    send_resolved: false
- name: default
  webhook_configs:
  - url: http://127.0.0.1:9094/
    send_resolved: true
- name: critical
  webhook_configs:
  - url: http://127.0.0.1:9094/
    send_resolved: true
  telegram_configs:
  - bot_token_file: /etc/alertmanager/telegram_bot_token
    chat_id: 8986669804
    api_url: https://api.telegram.org
    parse_mode: HTML
    send_resolved: true
    message: '{{ template "gale.telegram.message" . }}'
- name: pagerduty
  pagerduty_configs:
  - service_key: "{{ env "PAGERDUTY_KEY" }}"
    severity: "{{ .CommonLabels.severity }}"
    summary: "{{ .CommonAnnotations.summary }}"
    details:
      runbook_url: "{{ .CommonAnnotations.runbook_url }}"
      fleet_host: "{{ .CommonLabels.fleet_host }}"
- name: opsgenie
  opsgenie_configs:
  - api_key: "{{ env "OPSGENIE_KEY" }}"
    priority: "{{ .CommonLabels.severity }}"
    description: "{{ .CommonAnnotations.summary }}"
    tags: "gale,fleet"
    source: "gale-agent"
