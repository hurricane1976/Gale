groups:
- name: gale-slo
  interval: 30s
  rules:
  - alert: GalePeerDown
    expr: gale_service_up{unit=~".+-peer"} == 0
    for: 3m
    labels:
      severity: critical
      owner: gale
    annotations:
      summary: 'Peer listener down: {{ $labels.unit }}'
      runbook_url: https://gale-agent.tail2f1671.ts.net/runbooks.html
  - alert: GaleInfraDown
    expr: gale_service_up{unit=~"nginx|tailscaled|cron"} == 0
    for: 3m
    labels:
      severity: critical
      owner: gale
    annotations:
      summary: 'Infra unit down: {{ $labels.unit }}'
      runbook_url: https://gale-agent.tail2f1671.ts.net/runbooks.html
  - alert: GaleBackupStale
    expr: gale_backup_age_hours > 36
    for: 0m
    labels:
      severity: warning
      owner: gale
    annotations:
      summary: No verified backup in {{ $value }}h
      runbook_url: https://gale-agent.tail2f1671.ts.net/runbooks.html
  - alert: GaleSynthFailing
    expr: gale_synth_green_ratio < 1
    for: 10m
    labels:
      severity: warning
      owner: gale
    annotations:
      summary: Synthetic checks failing (green {{ $value }})
      runbook_url: https://gale-agent.tail2f1671.ts.net/runbooks.html
  - alert: GaleSynthStale
    expr: ((time() - gale_synth_run_unixtime > 900) or absent(gale_synth_run_unixtime)) or absent(gale_synth_run_unixtime)
    for: 0m
    labels:
      severity: warning
      owner: gale
      host: gale-agent
    annotations:
      summary: "No synthetic run in 15m \u2014 cron bridge down?"
      runbook_url: https://gale-agent.tail2f1671.ts.net/runbooks.html
