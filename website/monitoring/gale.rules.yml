groups:
- name: gale-slo
  interval: 30s
  rules:
  - alert: GalePeerDown
    expr: gale_service_up{unit=~".+-peer"} == 0
    for: 3m
    labels:
      severity: critical
      owner: gale
    annotations:
      summary: 'Peer listener down: {{ $labels.unit }}'
      runbook_url: https://gale-agent.tail2f1671.ts.net/runbooks.html#telemetry
  - alert: GaleInfraDown
    expr: gale_service_up{unit=~"nginx|tailscaled|cron"} == 0
    for: 3m
    labels:
      severity: critical
      owner: gale
    annotations:
      summary: 'Infra unit down: {{ $labels.unit }}'
      runbook_url: https://gale-agent.tail2f1671.ts.net/runbooks.html#collector
  - alert: GaleBackupStale
    expr: gale_backup_age_hours > 36
    for: 0m
    labels:
      severity: warning
      owner: gale
    annotations:
      summary: No verified backup in {{ $value }}h
      runbook_url: https://gale-agent.tail2f1671.ts.net/runbooks.html#recovery
